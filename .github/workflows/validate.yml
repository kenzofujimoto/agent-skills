name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate repository
        run: python scripts/validate_repo.py
      - name: Compile Python scripts
        run: python -m compileall -q scripts skills
      - name: Test repository tools
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Create package
        run: ./scripts/package-skill.sh motion-site-builder
      - name: Verify clean working tree
        run: git diff --exit-code
