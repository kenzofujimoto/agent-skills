name: Bug report
description: Report a reproducible problem in a skill or repository tool.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill and version
      placeholder: motion-site-builder 1.3.0
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Remove credentials and private data before pasting output.
